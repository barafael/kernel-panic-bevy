# Deterministic math (docs/multiplayer-plan.md, "Will different hardware
# compute the same results?"). Lockstep multiplayer needs every client to
# compute bit-identical simulation floats on every OS, CPU and browser.
# `+ - * / sqrt`, rounding and conversions are IEEE-754 exact everywhere;
# the std transcendentals below are not: they call the platform's C math
# library (glibc, macOS libm, the MSVC CRT; Rust's bundled libm on
# wasm32), and those round differently on 1-16 % of inputs.
#
# Use `bevy::math::ops::*` for f32 (the pure-Rust `libm` crate, because
# the workspace enables bevy's `libm` feature) and `libm::*` for f64 and
# for the f32 functions `ops` lacks. `x.powi(2)` is `x * x`. glam's own
# methods (`Quat::from_rotation_y`, `Vec2::from_angle`, `slerp`, ...) are
# fine: the workspace builds glam with `libm` + `scalar-math`.
#
# `mul_add` is banned too: Rust never contracts `a * b + c` by itself, so
# an explicit fused multiply-add is the only way FMA rounding enters the
# sim, and it is software-emulated (slow) on wasm32.
#
# Render-only and offline-bake code may opt out with a targeted
# `#[allow(clippy::disallowed_methods)]` and a comment saying why the
# value never reaches the simulation.
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm, differs across targets: use bevy::math::ops (or libm)" },
    { path = "f32::cos", reason = "platform libm, differs across targets: use bevy::math::ops (or libm)" },
    { path = "f32::tan", reason = "platform libm, differs across targets: use bevy::math::ops (or libm)" },
