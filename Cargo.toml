[workspace]

resolver = "3"

members = [
    "spring-tdf",
    "spring-map",
    "spring-pathfinding",
    "spring-detmath",
    "kernel-panic",
]
# Patched dependencies (`[patch.crates-io]` below) are not members.
exclude = ["vendor/webrtc-data"]
# exclude = [
#     "spring-cob",  # RETIRED — see note below
# ]

# RETIRED CRATE: spring-cob
# -------------------------
# `spring-cob` was a bytecode VM for Spring's compiled COB unit scripts
# (`.cob`, compiled from `.bos` by Scriptor). It ran every unit's
# animation: threads with sleep/wait-for-turn semantics, a data stack,
# signals, and an AnimCommand stream that the game translated into piece
# transforms.
#
# It was retired in favour of hand-written per-unit animation drivers in
# `kernel-panic/src/units/assets/animation/units/<kind>.rs` (one Rust
# struct per unit kind, translating the `.bos` entry points directly).
# The VM's sign conventions for piece rotations were also the root cause
# of wrong-direction unit animations (spin-X vs turn-X inconsistency,
# double-negated Z spins).
#
# Piece tables now live in code as static per-kind lists
# (`animation::units::piece_names`), so nothing reads `.cob` files any
# more. The crate directory is kept for posterity — it documents how
# the VM interpreted Spring's script bytecode (opcodes, thread
# scheduling, the Scriptor 163840 linear constant the drivers' value
# tables derive from) and is the reference oracle quoted by the Kani
# equivalence harnesses in `animation/proofs.rs`. Not a workspace
# member; no dependents. Not scheduled for deletion.

# `glam` is never imported by kernel-panic: it depends on it only so
# Cargo's feature unification turns `libm` + `scalar-math` on for Bevy's
# copy (see the `glam` entry below). cargo-shear can't see that, so it
# must not report it as unused.
[workspace.metadata.cargo-shear]
ignored = ["glam"]

[workspace.dependencies]
better_default = "1"
# Bevy 0.20.0 from the `kernel-panic-0.20` branch of
# github.com/barafael/bevy, pinned by commit: the v0.20.0 release plus
# - the start-up flicker fix (bevyengine/bevy#26245): the draw gate
#   `pipelines_are_loaded` didn't wait for the `unpack_bins` /
#   `allocate_uniforms` pipelines #23662 added, so on the first frames
#   after start-up meshes could be drawn with other meshes' materials;
# - bevyengine/bevy#26090 (in main, after 0.20.0): `UninitBufferVec` sizes
#   its entries by the shader's layout. With glam's `scalar-math` (on for
#   determinism, see `glam` below) `MeshUniform` is 168 bytes in Rust and
#   176 in WGSL, and a start-up with few meshes failed bind-group
#   validation ("Binding size 168 … less than minimum 176", #26087);
# - a `bevy_winit` fix: a hidden browser page counts as all windows
#   invisible, so a wake-up runs the app update there (Bevy updates once
#   per redraw, and a hidden page never gets one) — a background tab
#   keeps its networked match running (`net::web_tab`,
#   `net-experiments/m3-rooms.md` §1).
# Back to a crates.io release once one carries all three.
# `kernel-panic/Cargo.toml` pins the same commit.
bevy = { git = "https://github.com/barafael/bevy", rev = "6fa5f28789f7c7eb9a4fff1d879aef6120df5bf6", features = ["serialize", "libm"] }
# Deterministic math for lockstep multiplayer (docs/multiplayer-plan.md,
# "Will different hardware compute the same results?"): every client must
# compute bit-identical floats on Linux, Windows and macOS, x86_64 and
# arm64, and wasm32 in every browser.
# - `libm`: glam's own `sin cos atan2 powf ...` (and, through bevy's
#   `libm` feature, `bevy::math::ops`) call the pure-Rust `libm` crate
#   instead of each OS's C library, which round differently.
# - `scalar-math`: one scalar code path for Vec3A/Vec4/Quat/Mat4/Affine3A
#   on every target, instead of SSE2 on x86_64, NEON on arm64 and scalar
#   on wasm32 (different operation orders, different last bits).
# Cargo unifies features per build, so naming glam here and depending on
# it from every crate that links Bevy turns both on for Bevy's copy too.
glam = { version = "0.33", default-features = false, features = ["std", "libm", "scalar-math"] }
# Deterministic f64 math, and f32 functions `bevy::math::ops` lacks.
libm = "0.2"
# Target-independent float max / min / clamp (signed zeros; clippy.toml).
spring-detmath = { path = "spring-detmath" }
thiserror = "2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }

# Bevy debug runs are ~5-10x slower than release because dependencies
# (bevy, wgpu, glam) build with opt-level 0. Optimize all dependencies
# fully while keeping workspace crates at opt-1: near-release FPS with
# debug-grade compile times and full debug info for the game code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
# opt 1, not 2/3: bevy_pbr/bevy_render at opt>=2 OOM-kill rustc on ~8 GB
# free RAM. opt 1 already gives the big win over opt 0 (bounds-check
# elimination, inlining, debug_asserts still on) — Bevy runs several
# times faster than fully-unoptimized dev builds.
opt-level = 1
# Dependencies don't need debug info: cuts rustc peak memory and shrinks
# the target dir massively.
debug = false

# NOTE: the mixed profile (opt-1 workspace + opt-1/debug=false deps) can
# trip a nightly rust-lld flake — "undefined hidden symbol: anon…" from
# stale incremental codegen units. Rebuild with `CARGO_INCREMENTAL=0`
# once if it appears.


# The wasm-release profile: optimize for runtime speed on web (not size
# exclusively). Selected by `index.html`'s `data-cargo-profile` for the
# Trunk build; GitHub Pages deploys it via .github/workflows/deploy.yml.
[profile.release]
# Cross-crate inlining between the game and Bevy without the full
# link-time cost of fat LTO; unwinding is never caught by the game.
lto = "thin"
panic = "abort"

[profile.wasm-release]
inherits = "release"
# Optimize for speed. wasm-opt (data-wasm-opt="2" in index.html) also
# runs -O2 post-build. No LTO: linking Bevy for wasm with LTO needs
# more memory than this machine has to spare during a `trunk serve`.
opt-level = 2
lto = false
# Strip all debugging information from the binary to slightly reduce
# file size.
strip = "debuginfo"

# webrtc-data 0.17.2 with one fix: negotiated data channels (matchbox
# creates every channel negotiated) never committed their reliability
# parameters, so matchbox's "unreliable" channel was ordered and fully
# reliable on native peers — every lost packet held up everything behind
# it for a fast retransmit (~100–200 ms) or the 1 s retransmission timeout
# (`net-experiments/m2-transport.md` §7). `vendor/webrtc-data/README.md`.
[patch.crates-io]
webrtc-data = { path = "vendor/webrtc-data" }
