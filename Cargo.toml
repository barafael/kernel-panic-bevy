[workspace]

resolver = "3"

members = [
    "spring-tdf",
    "spring-map",
    "spring-map-gen",
    "spring-unit-mesh",
    "spring-pathfinding",
    "kernel-panic",
]
# exclude = [
#     "spring-cob",  # RETIRED — see note below
# ]

# RETIRED CRATE: spring-cob
# -------------------------
# `spring-cob` was a bytecode VM for Spring's compiled COB unit scripts
# (`.cob`, compiled from `.bos` by Scriptor). It ran every unit's
# animation: threads with sleep/wait-for-turn semantics, a data stack,
# signals, and an AnimCommand stream that the game translated into piece
# transforms.
#
# It was retired in favour of hand-written per-unit animation drivers in
# `kernel-panic/src/units/assets/animation/units/<kind>.rs` (one Rust
# struct per unit kind, translating the `.bos` entry points directly).
# The VM's sign conventions for piece rotations were also the root cause
# of wrong-direction unit animations (spin-X vs turn-X inconsistency,
# double-negated Z spins).
#
# Piece tables now live in code as static per-kind lists
# (`animation::units::piece_names`), so nothing reads `.cob` files any
# more. The crate directory is kept in the repo for reference but is no
# longer a workspace member and has no dependents. Safe to delete.

[workspace.dependencies]
better_default = "1"
bevy = { version = "0.18", features = ["serialize"] }
byteorder = "1.5"
thiserror = "2"
sevenz-rust = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Bevy debug runs are ~5-10x slower than release because dependencies
# (bevy, wgpu, glam) build with opt-level 0. Optimize all dependencies
# fully while keeping workspace crates at opt-1: near-release FPS with
# debug-grade compile times and full debug info for the game code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
# opt 1, not 2/3: bevy_pbr/bevy_render at opt>=2 OOM-kill rustc on ~8 GB
# free RAM. opt 1 already gives the big win over opt 0 (bounds-check
# elimination, inlining, debug_asserts still on) — Bevy runs several
# times faster than fully-unoptimized dev builds.
opt-level = 1
# Dependencies don't need debug info: cuts rustc peak memory and shrinks
# the target dir massively.
debug = false

# NOTE: the mixed profile (opt-1 workspace + opt-1/debug=false deps) can
# trip a nightly rust-lld flake — "undefined hidden symbol: anon…" from
# stale incremental codegen units. Rebuild with `CARGO_INCREMENTAL=0`
# once if it appears.


# The wasm-release profile: optimize for runtime speed on web (not size
# exclusively). Selected by `index.html`'s `data-cargo-profile` for the
# Trunk build; GitHub Pages deploys it via .github/workflows/deploy.yml.
[profile.wasm-release]
inherits = "release"
# Optimize for speed. wasm-opt (data-wasm-opt="2" in index.html) also
# runs -O2 post-build.
opt-level = 2
# Strip all debugging information from the binary to slightly reduce
# file size.
strip = "debuginfo"
