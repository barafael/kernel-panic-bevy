[package]
name = "kernel-panic"
version = "0.1.0"
edition = "2024"

[dependencies]
spring-tdf = { path = "../spring-tdf" }
spring-map = { path = "../spring-map" }
spring-unit-mesh = { path = "../spring-unit-mesh" }
spring-pathfinding = { path = "../spring-pathfinding" }
bevy = { version = "0.18", features = ["debug", "custom_cursor"] }
better_default = { workspace = true }
thiserror = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
# The embedded unit bundle (`assets/units.kpu`, see `units::content::bundle`):
# postcard payload in a zstd frame, decoded by the pure-Rust ruzstd on
# native and wasm alike.
serde = { workspace = true }
postcard = { workspace = true }
ruzstd = "0.8"

# `KP_BAKE_UNITS` encoder side: the bake reads the upstream checkout and
# runs native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"

# Web: the render settings persist in `localStorage`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# The kani proof harnesses (animation/proofs.rs) are compiled only under
# `cargo kani`, which sets cfg(kani). Declare it so normal builds don't
# warn about an unknown cfg.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
