[package]
name = "kernel-panic"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
# Target-independent float max / min / clamp (workspace clippy.toml).
spring-detmath = { workspace = true }
spring-tdf = { path = "../spring-tdf" }
spring-map = { path = "../spring-map" }
spring-pathfinding = { path = "../spring-pathfinding" }
# `libm`: deterministic `bevy::math::ops` (see the workspace `glam` entry).
# Same fork and commit as the workspace `bevy` (see the root Cargo.toml).
bevy = { git = "https://github.com/barafael/bevy", rev = "6fa5f28789f7c7eb9a4fff1d879aef6120df5bf6", features = ["debug", "custom_cursor", "libm"] }
# Never imported: depending on glam turns its `libm` + `scalar-math`
# features on for Bevy's copy (workspace Cargo.toml explains why).
glam = { workspace = true }
# For `sim::tests::deterministic_math_is_configured` (`ops` vs libm);
# a regular dependency so it doesn't add a second dev-dependencies
# table for merges to trip over. Already in the tree via bevy_math.
libm = { workspace = true }
better_default = { workspace = true }
thiserror = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
# The embedded unit bundle (`assets/units.kpu`, see `units::content::bundle`):
# postcard payload in a zstd frame, decoded by the pure-Rust ruzstd on
# native and wasm alike. The unit definitions are embedded as text
# (`units::content::defs`) and parsed by spring-tdf at startup.
serde = { workspace = true }
postcard = { workspace = true }
ruzstd = "0.9"
# The sound effects decode once, at load (`audio::Sfx`): Bevy's own
# `AudioSource` re-parses the Vorbis headers on the main thread for every
# sound it starts. The rodio Bevy already links (its `lewton` decoder on
# through Bevy's `vorbis` feature), named for `Decoder` / `SamplesBuffer`.
rodio = { version = "0.22", default-features = false }
# Multiplayer transport (`net::matchbox`, docs/multiplayer-plan.md M2):
# WebRTC data channels through barafael's matchbox fork (Bevy 0.20, the
# socket robustness fixes of johanhelsing/matchbox#558; the fork and
# revision cake and omdurman use, pinned by Cargo.lock). Native peers
# run webrtc-rs, the web build the browser's WebRTC; both meet in the
# same rooms.
matchbox_socket = { git = "https://github.com/barafael/matchbox.git", branch = "main" }
# matchbox's peer ids are UUIDs; `net::matchbox` maps them to and from
# `PeerId(u128)`. Already in the tree through matchbox.
uuid = "1"

# Native: the datavent editor (`map_editor`, `KP_MAP_EDIT`) writes
# `.kpmap` files; the encoder binds the C zstd library, so not on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spring-map = { path = "../spring-map", features = ["write"] }

# Web: the render settings persist in `localStorage`; `Math.random()`
# seeds the per-launch rolls (`rng::clock_f64`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Blob / Url / HtmlAnchorElement: the desync dump download (`net::driver`).
# Location / History: the room code in the URL fragment (`net::lobby`).
# HtmlInputElement / FileList / File: the Replays page's "Open file…"
# (`ui::menu::replays_page`).
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Location", "History", "HtmlInputElement", "FileList", "File", "Worker", "MessageEvent", "Event", "EventTarget"] }
js-sys = "0.3"
# The `replay` feature's `kp_replay` export and its event-loop yields
# (`headless`). Both are already linked through Bevy on the web.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
# The golden-replay matrix (`docs/multiplayer-plan.md` M0.4,
# `net-experiments/m0-golden-replay.md`): compiles the headless harness
# into the binary. Native: `kernel-panic --replay <log>…` and
# `--record-golden`; wasm32: the module exports `kp_replay` instead of
# starting the game. Off for the game itself.
replay = []

# The kani proof harnesses (animation/proofs.rs) are compiled only under
# `cargo kani`, which sets cfg(kani). Declare it so normal builds don't
# warn about an unknown cfg.
[dev-dependencies]
# The music catalog test parses `assets/music/catalog.json`.
serde_json = "1"
# The real-WebRTC lockstep tests (`net::matchbox_tests`) run a signaling
# server in process, with the room semantics of the deployed
# `matchbox_server` (`net-experiments/m2-transport.md`).
kp-signaling = { path = "../kp-signaling" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

# `build.rs` reads each map's metadata (start positions, the players its
# description names) into the catalog.
[build-dependencies]
spring-map = { path = "../spring-map" }
