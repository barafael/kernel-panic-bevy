[package]
name = "kernel-panic"
version = "0.1.0"
edition = "2024"

[dependencies]
spring-tdf = { path = "../spring-tdf" }
spring-map = { path = "../spring-map" }
spring-unit-mesh = { path = "../spring-unit-mesh" }
spring-pathfinding = { path = "../spring-pathfinding" }
bevy = { version = "0.18", features = ["serialize", "debug", "custom_cursor"] }
tracing-chrome = "0.7"
better_default = { workspace = true }
thiserror = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
# Async `Reader::read_to_end` for the BytesAsset loader (web map fetch).
futures-lite = "2"

# The kani proof harnesses (animation/proofs.rs) are compiled only under
# `cargo kani`, which sets cfg(kani). Declare it so normal builds don't
# warn about an unknown cfg.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
