name: Upstream game data
description: >
  Check out the upstream data the bake and the upstream-comparing tests
  read: the Kernel-Panic submodule (public, ~12 MB) in full, and from the
  RecoilEngine submodule (~200 MB) only the three engine bitmaps the unit
  bundle takes (`units::content::bundle::bake::ENGINE_BITMAPS`).

# Without this step those tests skip themselves (they print "skip…" and
# pass), which is what the non-Linux test jobs do. With it, CI also checks
# that the committed `kernel-panic/assets/units.kpu` is what the pinned
# upstream commit bakes to (`bundle_matches_upstream_checkout`).

runs:
  using: composite
  steps:
    - name: Fetch upstream data
      shell: bash
      run: |
        git submodule update --init --depth 1 upstream/Kernel-Panic

        # The pinned RecoilEngine commit, straight from the superproject's
        # gitlink, so the bitmaps always match the submodule pointer.
        recoil=$(git ls-tree HEAD upstream/RecoilEngine | awk '{print $3}')
        dir=upstream/RecoilEngine/cont/base/bitmaps/bitmaps
        mkdir -p "$dir"
        for name in laserend.tga laserfalloff.tga flare.tga; do
          curl -fsSL --retry 3 -o "$dir/$name" \
            "https://raw.githubusercontent.com/beyond-all-reason/RecoilEngine/$recoil/cont/base/bitmaps/bitmaps/$name"
        done
        ls -l "$dir"
