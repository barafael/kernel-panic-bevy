name: Determinism

# Cross-platform golden-replay matrix (docs/multiplayer-plan.md, M0.4).
#
# Every platform replays the same golden command logs headless and writes
# the per-tick state-hash trail; the `compare` job then requires every
# trail to be byte-identical to the Linux x86_64 (glibc) reference and
# reports the first diverging tick otherwise.
#
# STATUS: skeleton. The matrix, the artifact plumbing and the comparison
# (.github/scripts/compare-trails.sh) are live; the replay itself is not
# written yet. Until golden logs exist every job finds none and skips its
# build, so this costs seconds. Once logs land but the replay command
# below is still the placeholder, the jobs fail loudly instead of passing.
#
# CONTRACT — what the M0.4 replay has to provide:
#
# 1. Golden logs: `kernel-panic/tests/golden/*.kpreplay` (GOLDEN_DIR and
#    GOLDEN_EXT below; rename freely, they are only used here). Each holds
#    (match setup, seed, command log).
# 2. A native entry point that replays one log and writes its trail, e.g.
#      cargo run --release --locked -p kernel-panic --bin kp-replay -- \
#        <log> --trail <out>
#    (or an #[ignore]d test driven by env vars, as X-sim's
#    `headless::tests::determinism` with KP_NET_TRACE). Replace the body of
#    the "Replay (native)" step with it.
# 3. A wasm32 entry point for the same replay, run in Node and in headless
#    Chromium/Firefox/WebKit (wasm-bindgen-test or Playwright): fill in the
#    "Replay (wasm)" step. The log has to be embedded or fetched, wasm has
#    no filesystem.
# 4. Trail format: one line per tick, `<tick> <hash as hex>`, LF line
#    endings, written to `trails/<log stem>.trail`. The compare script
#    diffs files byte for byte and prints the first differing line, so
#    extra per-tick columns (part hashes: positions/health/orders) are
#    welcome and make bisecting easier.
#
# Each job uploads its `trails/` directory as artifact `trail-<platform>`.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  GOLDEN_DIR: kernel-panic/tests/golden
  GOLDEN_EXT: kpreplay

jobs:
  native:
    name: replay (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reference trail. Must stay named linux-x86_64-gnu (compare job).
          - platform: linux-x86_64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # musl ships its own libm: a different transcendental
          # implementation unless the sim routes through `libm`/bevy_math.
          - platform: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Free arm64 runners for public repos: a second ISA (NEON, and
          # FMA contraction would show up here first).
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # x86_64 macOS binary under Rosetta 2 on the arm64 runner: Apple's
          # x86_64 libm without needing an (expiring) Intel runner.
          - platform: macos-x86_64-rosetta
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Find golden logs
        id: golden
        shell: bash
        run: |
          shopt -s nullglob
          logs=("$GOLDEN_DIR"/*."$GOLDEN_EXT")
          echo "found=$([ ${#logs[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "${#logs[@]} golden log(s) in $GOLDEN_DIR"
      - if: steps.golden.outputs.found == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: steps.golden.outputs.found == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y -q --no-install-recommends musl-tools
      - if: steps.golden.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: steps.golden.outputs.found == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Replay (native)
        if: steps.golden.outputs.found == 'true'
        shell: bash
        run: |
          mkdir -p trails
          for log in "$GOLDEN_DIR"/*."$GOLDEN_EXT"; do
            stem=$(basename "$log" ".$GOLDEN_EXT")
            # TODO(M0.4): the real replay, e.g.
            # cargo run --release --locked -p kernel-panic --bin kp-replay \
            #   --target ${{ matrix.target }} -- "$log" --trail "trails/$stem.trail"
            echo "::error::golden log $stem present, but the replay command in determinism.yml is still a placeholder"
            exit 1
          done
      - if: steps.golden.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trail-${{ matrix.platform }}
          path: trails/
          if-no-files-found: error

  wasm:
    name: replay (wasm-${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        # Web-to-web is expected identical (same wasm, bundled libm, strict
        # IEEE engines); native-to-web is the cross-play risk this proves.
        runtime: [node, chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find golden logs
        id: golden
        shell: bash
        run: |
          shopt -s nullglob
          logs=("$GOLDEN_DIR"/*."$GOLDEN_EXT")
          echo "found=$([ ${#logs[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.golden.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.golden.outputs.found == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: steps.golden.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Replay (wasm)
        if: steps.golden.outputs.found == 'true'
        shell: bash
        run: |
          mkdir -p trails
          # TODO(M0.4): build the replay for wasm32-unknown-unknown and run it
          # in ${{ matrix.runtime }}, writing trails/<log stem>.trail:
          # - node: wasm-bindgen --target nodejs + a small runner script, or
          #   `wasm-bindgen-test-runner` (CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER);
          # - browsers: `npx playwright install --with-deps ${{ matrix.runtime }}`
          #   and a page that runs the replay and posts the trail back, or
          #   wasm-bindgen-test with WASM_BINDGEN_TEST_ONLY_WEB and the
          #   matching WebDriver (chromedriver/geckodriver; WebKit via Playwright).
          echo "::error::golden logs present, but the wasm replay in determinism.yml is still a placeholder"
          exit 1
      - if: steps.golden.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trail-wasm-${{ matrix.runtime }}
          path: trails/
          if-no-files-found: error

  compare:
    name: compare trails
    needs: [native, wasm]
    # Compare whatever trails exist even when a platform failed, so the
    # summary shows every divergence at once.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: trail-*
          path: trails
      - name: Compare hash trails against linux-x86_64-gnu
        run: bash .github/scripts/compare-trails.sh trails linux-x86_64-gnu
