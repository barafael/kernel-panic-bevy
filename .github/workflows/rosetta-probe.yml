name: Rosetta probe

# Diagnostic for the sporadic `macos-x86_64-rosetta diverges from
# linux-x86_64-gnu` in determinism.yml (since 2026-10-21): replays the
# golden logs under Rosetta 2 several times on one runner, compares
# the runs with each other and with a Linux reference trail (the
# `trail-linux-x86_64-gnu` artifact of a main run with the same sim
# code), and dumps the unit state at the first diverging tick
# (.github/scripts/rosetta-probe.sh). Runs on every push of its own
# branch (a workflow only on a branch cannot be dispatched: GitHub
# registers workflows from the default branch) and by dispatch once it
# is there.

on:
  push:
    branches: [rosetta-probe]
  workflow_dispatch:
    inputs:
      reference_run:
        description: "Run id whose trail-linux-x86_64-gnu artifact is the reference"
        required: true
      runs:
        description: "Replays of every log"
        default: "4"

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  GOLDEN_DIR: kernel-panic/tests/golden
  # The push trigger has no inputs: main run 40338273605 (16c269d, the
  # sim code this branch carries) and four replays.
  REFERENCE_RUN: ${{ inputs.reference_run || '40338273605' }}
  RUNS: ${{ inputs.runs || '1' }}

jobs:
  # Named as determinism.yml's job so rust-cache finds its cache. Six
  # jobs, one replay each: run 40349916942's four replays on one host
  # all matched while main's runs of the same code diverged one in
  # three, so the difference may be between hosts, not between runs.
  native:
    name: rosetta probe ${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: replay-x86_64-apple-darwin
          save-if: false
      - name: Build the replay binary and the float probe
        run: |
          cargo build --release --locked -p kernel-panic --features replay --target x86_64-apple-darwin
          cd net-experiments/m0-floatprobe
          cargo build --release --locked --target x86_64-apple-darwin
      # Does a thread's float environment differ from the main thread's
      # under Rosetta? (The replay's task pools run float work on
      # pool threads: transform propagation, the path layers.)
      - name: Float probe on threads
        run: arch -x86_64 net-experiments/m0-floatprobe/target/x86_64-apple-darwin/release/floatprobe threads 8
      # Run 40371194065's job 3 diverged at a tick whose unit dumps were
      # identical to Linux's: the hash itself went wrong. It sorts byte
      # records (libc memcmp); the x86_64 libSystem picks its memcmp /
      # memcpy by cpuid, which Rosetta answers.
      - name: What Rosetta advertises, and memcmp / memcpy / sort against scalar loops
        run: |
          arch -x86_64 sysctl -a 2>/dev/null | grep -i "machdep.cpu" || true
          arch -x86_64 net-experiments/m0-floatprobe/target/x86_64-apple-darwin/release/floatprobe memcmp 30000000
          # Run 40382484840 job 10: 30 M comparisons exact under Rosetta.
          # Large copies next: a hash scratch buffer grows by realloc.
          arch -x86_64 net-experiments/m0-floatprobe/target/x86_64-apple-darwin/release/floatprobe memcpy 10000 4
      - name: Reference trails
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$REFERENCE_RUN" -R "${{ github.repository }}" -n trail-linux-x86_64-gnu -D reference
      - name: Hash the binary
        run: shasum -a 256 target/x86_64-apple-darwin/release/kernel-panic
      - name: Probe
        run: |
          bash .github/scripts/rosetta-probe.sh \
            target/x86_64-apple-darwin/release/kernel-panic "$GOLDEN_DIR" reference \
            "$RUNS" probe
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rosetta-probe-${{ matrix.sample }}
          path: probe/
          if-no-files-found: error

  # The minimal-reproducer attempt: the state hash's exact code over
  # unit-like records, continuously, twice per input and against a
  # scalar reference, with allocation churn and context switches, for
  # an hour on three threads under Rosetta (about a hundred times the
  # hashing a replay process does). A fault here is Rosetta's alone.
  stress:
    name: hash stress ${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build the float probe
        run: |
          cd net-experiments/m0-floatprobe
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Chip and Rosetta
        run: |
          sysctl -n machdep.cpu.brand_string hw.model
          sw_vers
      - name: Hash stress under Rosetta
        run: arch -x86_64 net-experiments/m0-floatprobe/target/x86_64-apple-darwin/release/floatprobe stress 3600 3
