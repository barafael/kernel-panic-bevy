name: Deploy to GitHub Pages

# Web build of the Bevy remake, deployed to GitHub Pages via trunk.
# Source archives (.sd7/.sdz) don't exist on wasm (plan §8.1) — the web
# build boots with an empty map catalog until the baked-map (`.kpmap`)
# path is wired to the asset server.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-cargo-

      - name: Install trunk
        run: |
          curl -LsSf https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.cargo/bin

      # Web can't extract .sd7/.sdz archives (no sevenz/mlua on wasm), so
      # bake every source map to the compressed .kpmap format first. The
      # kernel-panic build script embeds the resulting catalog at compile
      # time, and index.html's copy-dir ships the .kpmap files.
      - name: Bake maps (.kpmap)
        run: |
          cargo build --release -p spring-map --bin bake_map
          for f in kernel-panic/assets/maps/*.sd7 kernel-panic/assets/maps/*.sdz; do
            [ -e "$f" ] || continue
            ./target/release/bake_map "$f"
          done

      - name: Build
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
