[package]
name = "spring-map"
version = "0.1.0"
edition = "2024"
description = "Parser for Spring RTS engine map files (.smf/.smt/.sd7)"

[dependencies]
better_default = { workspace = true }
byteorder = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
# kpmap v2: deflate the postcard body (rust_backend/miniz_oxide is
# wasm-safe).
flate2 = "1"
# kpmap v3: zstd frames. ruzstd is a pure-Rust decoder (wasm-safe); the
# encoder side lives behind zstd on native bake targets only.
ruzstd = "0.8"
binrw = "0.15.1"
serde = { workspace = true }
postcard = { workspace = true }
image = { workspace = true }

# Source-archive support: `sevenz-rust` assumes native std fs and
# doesn't build for wasm32 — on web the baked `.kpmap` reader is the
# only load path (plan §8.1).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sevenz-rust = { workspace = true }
# kpmap v3 encoder (bake runs native only). The reader side uses ruzstd,
# which is pure Rust and wasm-safe.
zstd = "0.13"

[dev-dependencies]
proptest = { workspace = true }
# kpmap_bench example: routes paths across real baked terrain to audit
# the grid pathfinder against actual map cliffs.
spring-pathfinding = { path = "../spring-pathfinding" }

[lib]
doctest = false
