[package]
name = "spring-map"
version = "0.1.0"
edition = "2024"
description = "Parser for Spring RTS engine map files (.smf/.smt/.sd7)"

[dependencies]
better_default = { workspace = true }
byteorder = { workspace = true }
thiserror = { workspace = true }
sevenz-rust = { workspace = true }
zip = { workspace = true }
mlua = { version = "0.11", features = ["lua51", "vendored"] }
binrw = "0.15.1"
serde = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lib]
doctest = false
