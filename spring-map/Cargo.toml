[package]
name = "spring-map"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The game's .kpmap reader and the terrain code that runs on it"

[dependencies]
# Target-independent float max / min / clamp (workspace clippy.toml).
spring-detmath = { workspace = true }
# Datavent facings (`datavent`): the movers' slope limit and the
# heightmap's slopes, the same code the game's nav grid uses.
spring-pathfinding = { path = "../spring-pathfinding" }
# Deterministic transcendentals: the terrain code feeds the sim
# (workspace clippy.toml).
libm = { workspace = true }
better_default = { workspace = true }
thiserror = { workspace = true }
# `.kpmap`: a zstd frame around a postcard payload. ruzstd is a pure-Rust
# decoder (wasm-safe).
ruzstd = "0.9"
serde = { workspace = true }
postcard = { workspace = true }
# Encoder for `write` (the datavent editor). Native only: it binds the C
# zstd library.
zstd = { version = "0.14", optional = true }

[features]
# `baked::set_datavent_facings`: rewrite a `.kpmap`'s datavent facings.
write = ["dep:zstd"]

[dev-dependencies]
proptest = { workspace = true }
# The reader's round-trip tests encode what they decode.
zstd = "0.14"

[lib]
doctest = false

# Generates kernel-panic/assets/maps/deadlock_v1.kpmap.
[[example]]
name = "gen_deadlock"
required-features = ["write"]

# Generates kernel-panic/assets/maps/token_ring_v1.kpmap.
[[example]]
name = "gen_token_ring"
required-features = ["write"]

# Generates kernel-panic/assets/maps/heap_fragmentation_v1.kpmap.
[[example]]
name = "gen_heap"
required-features = ["write"]

# Generates kernel-panic/assets/maps/three_way_handshake_v1.kpmap.
[[example]]
name = "gen_three_way"
required-features = ["write"]

# Generates kernel-panic/assets/maps/circular_buffer_{3,4,5,6}_v1.kpmap.
[[example]]
name = "gen_circular_buffer"
required-features = ["write"]

# Generates kernel-panic/assets/maps/pipeline_v1.kpmap.
[[example]]
name = "gen_pipeline"
required-features = ["write"]
