[package]
name = "spring-cob"
version = "0.1.0"
edition = "2024"
description = "Parser and virtual machine for Spring RTS engine COB animation scripts"

[dependencies]
binrw = "0.15.1"
smallvec = "1.15.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lib]
doctest = false

# Retired from the parent workspace (see the note in the root
# Cargo.toml). This empty [workspace] section detaches the crate so it
# can still be built standalone for the `cobdump` example below.
[workspace]
